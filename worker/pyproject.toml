[project]
name = "app-worker"
version = "0.5.0"
description = "Worker of the app: reads the files of the datasets for the backend"
requires-python = ">=3.13"
dependencies = [
    "celery[redis]>=5.7.0",
    "httpx2>=2.16.2",
    "pyarrow>=26.0.1",
    "pydantic-settings>=2.16.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "ty>=0.0.109",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["worker"]
branch = true

[tool.coverage.report]
fail_under = 80
